<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163a18"><meta name="description" content="利韩兵团像素驻地：活动、公告、游戏和树洞。"><title>Levi × Hans｜利韩兵团</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='8' width='64' height='64' fill='%23502b15'/%3E%3Cpath d='M13 16h38v32H13z' fill='%23d99a4b' stroke='%232a160b' stroke-width='5'/%3E%3Cpath d='m21 24 11 18 11-18M17 32h30' fill='none' stroke='%23fff0ac' stroke-width='4'/%3E%3C/svg%3E"><link rel="stylesheet" href="./styles.css"></head><body>
<main class="pixel-world" id="home"><div class="game-stage">
<button class="sound-button pixel-button" type="button" aria-pressed="true" aria-label="关闭环境音"><img src="./assets/sound.png" alt=""><span>ON</span></button>
<header class="brand-sign" aria-label="Levi × Hans 利韩兵团"><div class="brand-copy"><small>LEVI × HANS</small><strong>利韩兵团驻地</strong></div></header>
<section class="board-cluster" aria-label="兵团信息面板"><img class="board-set" src="./assets/pixel-board-set.png" alt=""><img class="board-moss" src="./assets/pixel-moss.png" alt="">
<section class="activity-window" aria-labelledby="activity-title"><div class="panel-kicker"><span>RECENT MISSION</span><b id="activity-page">01 / 03</b></div><h1 id="activity-title">近期利韩活动</h1><article id="activity-card" class="activity-card"></article><div class="activity-controls"><button class="pixel-button prev-activity" type="button" aria-label="上一项活动">◀</button><div class="activity-dots" aria-hidden="true"></div><button class="pixel-button next-activity" type="button" aria-label="下一项活动">▶</button></div></section>
<img class="pixel-person hange" src="./assets/hange-pixel.png" alt="韩吉像素人物"><img class="pixel-person levi" src="./assets/levi-pixel.png" alt="利威尔像素人物">
<section class="notice-window" id="notice" aria-labelledby="notice-title"><div class="notice-heading"><span>●</span><h2 id="notice-title">兵团公告</h2></div><div class="notice-line"><b id="notice-label">最新公告</b><p id="notice-copy"></p></div><div class="notice-controls"><button type="button" aria-label="上一条公告">▲</button><button type="button" aria-label="下一条公告">▼</button></div></section>
<div class="portal-window" aria-label="互动入口"><button class="portal-button" type="button" data-open="games"><img src="./assets/tatakae.png" alt=""><span><strong>塔塔开</strong><small>选择游戏</small></span></button><button class="portal-button" type="button" data-open="treehole"><img src="./assets/tree-hole.png" alt=""><span><strong>树洞</strong><small>投递心声</small></span></button></div></section>
<nav class="pixel-nav" aria-label="兵团导航"><img class="nav-frame" src="./assets/pixel-nav-frame.png" alt=""><div class="nav-items"><a href="#home" data-view="home" aria-label="兵团驻地"><img src="./assets/base.png" alt=""><span>驻地</span></a><a href="#notice" data-view="notice" aria-label="兵团公告"><img src="./assets/barn.png" alt=""><span>公告</span></a><a href="#treehole" data-open="treehole" aria-label="联络与树洞"><img src="./assets/contact.png" alt=""><span>联络</span></a><a href="#resources" data-open="resources" aria-label="资源外链"><img src="./assets/links.png" alt=""><span>资源</span></a></div></nav>
</div></main>
<div class="modal-layer" id="modal-layer" hidden><section class="pixel-modal" id="games-panel" hidden aria-labelledby="games-title"><button class="modal-close pixel-button" type="button" aria-label="关闭">×</button><p class="modal-kicker">GAME SELECT</p><h2 id="games-title">选择游戏</h2><button class="game-option" id="start-tatakae" type="button"><img src="./assets/tatakae.png" alt=""><span><strong>塔塔开！</strong><small>30 秒兵团训练</small></span><b>START ▶</b></button><div class="game-option disabled"><span class="mystery">?</span><span><strong>秘密行动</strong><small>尚未解锁</small></span></div></section>
<section class="pixel-modal" id="treehole-panel" hidden aria-labelledby="treehole-title"><button class="modal-close pixel-button" type="button" aria-label="关闭">×</button><p class="modal-kicker">ANONYMOUS LETTER</p><h2 id="treehole-title">利韩兵团树洞心声投递</h2><form id="treehole-form"><div class="moods" role="group" aria-label="选择心情"><button type="button">☀ 晴朗</button><button type="button">☁ 平静</button><button type="button">☂ 低落</button><button type="button">⚡ 生气</button></div><label for="message">想对兵团说的话</label><textarea id="message" maxlength="500" required placeholder="心声会被认真收好……"></textarea><div class="form-actions"><span id="char-count">0 / 500</span><button class="pixel-button submit-button" type="submit">投递心声</button></div></form><div class="success-message" hidden><b>心声已封存 ✓</b><span>谢谢你愿意说出来。</span></div></section>
<section class="pixel-modal" id="resources-panel" hidden aria-labelledby="resources-title"><button class="modal-close pixel-button" type="button" aria-label="关闭">×</button><p class="modal-kicker">LINK PORTAL</p><h2 id="resources-title">兵团资源入口</h2><div class="resource-links"><a href="#home" data-close-modal><img src="./assets/base.png" alt=""><span><strong>兵团驻地</strong><small>返回活动首页</small></span></a><a href="#notice" data-close-modal><img src="./assets/barn.png" alt=""><span><strong>公告档案</strong><small>查看最新公告</small></span></a><button type="button" data-switch="treehole"><img src="./assets/contact.png" alt=""><span><strong>树洞联络</strong><small>匿名投递心声</small></span></button></div></section></div>
<section class="battle-screen" id="battle-screen" hidden aria-label="塔塔开训练场"><div class="battle-hud"><span>SCORE <b id="score">000</b></span><strong>TATAKAE!</strong><span>TIME <b id="timer">30</b></span></div><button id="battle-target" class="battle-target" type="button" aria-label="训练目标">⚔</button><div id="battle-finish" class="battle-finish" hidden><small>MISSION CLEAR</small><strong><span id="final-score">0</span> 分</strong><button id="replay-game" class="pixel-button" type="button">再来一次</button></div><button id="exit-game" class="exit-game pixel-button" type="button">退出训练</button></section><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="./app.js"></script></body></html>
