    <script>
      // 独立 PWA（iOS 添加到主屏幕）与 WebKit 布局适配标记。
      // iOS WebKit 在 Standalone 模式下，100dvh 在部分 iOS 版本会少算顶部状态栏或多减去安全区高度；
      // 而 Standalone 模式没有 Safari 地址栏的伸缩特性，视口固定，以 window.innerHeight 注入 --app-h 最为精准。
      (function () {
        try {
          var ua = window.navigator.userAgent || '';
          var isIOSWebKit = /iP(?:hone|ad|od)/.test(ua) ||
            (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
          if (isIOSWebKit) document.documentElement.classList.add('ios-webkit');
          var isStandalone =
            window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;
          if (isStandalone) {
            document.documentElement.classList.add('pwa-standalone');
          }
          var syncAppHeight = function () {
            var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || (document.documentElement && document.documentElement.clientHeight);
            if (h) {
              document.documentElement.style.setProperty('--app-h', h + 'px');
            }
          };
          syncAppHeight();
          window.addEventListener('resize', syncAppHeight, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncAppHeight, { passive: true });
          }
          window.addEventListener('orientationchange', function () {
            setTimeout(syncAppHeight, 150);
          }, { passive: true });
          window.addEventListener('pageshow', syncAppHeight, { passive: true });
        } catch (e) {}
      })();
    </script>
    <script>
      // 后台路径兜底：/admin 一律交给后台域名。
      // 正常情况下 Vercel 已 308 跳转，但**旧版 Service Worker 会把 /admin 导航回退成
      // 这份前台首页**（navigateFallback），用户就会「点后台进到主页」。
      // 这段在 SW 回退命中时依然会执行，因此作为兜底把用户送回后台。
      (function () {
        try {
          var p = location.pathname;
          if (p === '/admin' || p.indexOf('/admin/') === 0) {
            location.replace('https://admin.levihan.asia/' + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // ── 部署脱节自愈：防止「新版一上线，老页面切懒加载分区就白屏」────────────
      // 本站注册了 PWA Service Worker，产物 sw.js 带 skipWaiting + clientsClaim：
      // 新版一装好立刻接管，并（cleanupOutdatedCaches）清掉旧的预缓存。
      // 但**正在浏览的页面不会自己刷新**，内存里还是旧代码；此时切到懒加载分区
      // （巨树餐厅 / 茶会 / 联络）就会去网络拉「旧版 chunk 文件名」——
      // 那个文件在新部署里已经不存在（404）→ 模块加载失败 → 整页白屏。
      // 这不是浏览器坏了，是「页面比部署落后」。对策：拿到新版就自动刷一次，
      // chunk 加载失败也自动刷一次（同一段脚本也内联在 comic.html，改动请同步）。
      (function () {
        var FLAG = 'lh-auto-reload';
        var reloading = false;
        function safeReload() {
          if (reloading) return;
          reloading = true;
          try {
            if (sessionStorage.getItem(FLAG) === '1') return; // 本会话已自动刷过 → 放弃（防死循环）
            sessionStorage.setItem(FLAG, '1');
          } catch (e) { /* 隐私模式不可写：靠内存标记兜底 */ }
          var el = document.activeElement;
          var typing = !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable));
          if (typing) {
            // 正在输入，不打断，等页面切到后台再刷
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'hidden') location.reload();
            }, { once: true });
            return;
          }
          location.reload();
        }

        var CHUNK_RE = /dynamically imported module|Importing a module script failed|Loading chunk|loading CSS chunk/i;
        window.addEventListener('vite:preloadError', function (e) {
          if (e && e.preventDefault) e.preventDefault();
          safeReload();
        });
        window.addEventListener('unhandledrejection', function (e) {
          var m = '';
          try { m = String((e.reason && (e.reason.message || e.reason)) || ''); } catch (err) {}
          if (CHUNK_RE.test(m)) safeReload();
        });
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          var url = t && (t.src || t.href);
          // 入口或分包脚本 404（旧页面拉旧文件名的典型症状）
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && typeof url === 'string' && url.indexOf('/assets/') !== -1) {
            safeReload();
            return;
          }
          if (CHUNK_RE.test(String((e && e.message) || ''))) safeReload();
        }, true);

        if ('serviceWorker' in navigator) {
          var hadController = !!navigator.serviceWorker.controller; // 首次安装为 false → 不刷
          var swDone = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController || swDone) return;
            swDone = true;
            safeReload();
          });
        }
      })();
    </script>
