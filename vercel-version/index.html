    <script>
      // 独立 PWA（iOS 添加到主屏幕）标记。
      // iOS standalone 下 100dvh 会比真实屏幕矮一个 env(safe-area-inset-top)，
      // 必须换成 100vh；这里提前打标记，避免首帧按错误的高度绘制。
      (function () {
        try {
          var isStandalone =
            window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;
          if (isStandalone) document.documentElement.classList.add('pwa-standalone');
        } catch (e) {}
      })();
    </script>
    <script>
      // 后台路径兜底：/admin 一律交给后台域名。
      // 正常情况下 Vercel 已 308 跳转，但**旧版 Service Worker 会把 /admin 导航回退成
      // 这份前台首页**（navigateFallback），用户就会「点后台进到主页」。
      // 这段在 SW 回退命中时依然会执行，因此作为兜底把用户送回后台。
      (function () {
        try {
          var p = location.pathname;
          if (p === '/admin' || p.indexOf('/admin/') === 0) {
            location.replace('https://admin.levihan.asia/' + location.hash);
          }
        } catch (e) {}
      })();
    </script>
