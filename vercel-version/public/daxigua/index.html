    <!-- 战功上报：在 Cocos 写入存档时把分数回传给宿主页面。
         只 hook Storage.prototype.setItem，不改动 project.js。
         宿主（TatakaruGame）监听 type='daxigua-result' 的 message。 -->
    <script type="text/javascript">
        (function () {
            var KEY_RE = /playerData\d+$/;
            var originalSetItem = Storage.prototype.setItem;
            Storage.prototype.setItem = function (key, value) {
                try {
                    if (KEY_RE.test(key)) {
                        var data = JSON.parse(value);
                        var score = Math.max(Number(data && data.score) || 0, Number(data && data.highScore) || 0);
                        if (score > 0 && window.parent !== window) {
                            window.parent.postMessage({ type: 'daxigua-result', score: score }, '*');
                        }
                    }
                } catch (e) { /* 非 JSON 或跨域时静默 */ }
                return originalSetItem.apply(this, arguments);
            };

            // 音频环境激活与交互握手：解除浏览器对 Cocos WebAudio 的限制，并通知宿主播放 BGM
            var hasNotifiedHost = false;
            var unlockAudioAndWakeHost = function () {
                try {
                    var ctx = window.cc && cc.sys && cc.sys.__audioSupport && cc.sys.__audioSupport.context;
                    if (ctx && ctx.state === 'suspended') {
                        ctx.resume();
                    }
                } catch (e) {}
                if (!hasNotifiedHost) {
                    hasNotifiedHost = true;
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'daxigua-user-interaction' }, '*');
                        }
                    } catch (e) {}
                }
            };
            ['touchstart', 'touchend', 'mousedown', 'pointerdown', 'click'].forEach(function (evt) {
                window.addEventListener(evt, unlockAudioAndWakeHost, { passive: true });
            });

            // 跨宿主与页面可见性生命周期控制：后台/隐藏时挂起 Cocos2d 渲染循环与 WebAudio
            var handlePauseGame = function () {
                try {
                    if (window.cc && window.cc.game && typeof window.cc.game.pause === 'function') {
                        window.cc.game.pause();
                    }
                    var ctx = window.cc && cc.sys && cc.sys.__audioSupport && cc.sys.__audioSupport.context;
                    if (ctx && ctx.state === 'running') {
                        ctx.suspend();
                    }
                } catch (e) {}
            };

            var handleResumeGame = function () {
                try {
                    if (window.cc && window.cc.game && typeof window.cc.game.resume === 'function') {
                        window.cc.game.resume();
                    }
                    var ctx = window.cc && cc.sys && cc.sys.__audioSupport && cc.sys.__audioSupport.context;
                    if (ctx && ctx.state === 'suspended') {
                        ctx.resume();
                    }
                } catch (e) {}
            };

            window.addEventListener('message', function (e) {
                if (!e || !e.data) return;
                if (e.data.type === 'pause' || e.data.type === 'game-pause') {
                    handlePauseGame();
                } else if (e.data.type === 'resume' || e.data.type === 'game-resume') {
                    handleResumeGame();
                }
            });

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    handlePauseGame();
                } else {
                    handleResumeGame();
                }
            });

            window.__DAXIGUA_RESULT_PREVIEW__ = new URLSearchParams(window.location.search).has('result-preview');
        })();
    </script>

        /* 桩函数：替代已移除的 ads.js 广告逻辑。

        var showMyAds = function () { console.log("showMyAds stub"); };
        var __sceneLaunched = false;
        var noAdGoToScene = function () {
            if (__sceneLaunched) return;
            __sceneLaunched = true;
            try {
                var cfg = __require("GameConfig");
                var sceneName = cfg.launchScene;
                console.log("noAdGoToScene: launching", sceneName);
                var hideLoading = function () {
                    var lt = document.getElementById("loadingText");
                    if (lt) { lt.style.display = "none"; }
                    var sp = document.getElementById("splash");
                    if (sp) { sp.style.display = "none"; }
                };
                cc.director.on(cc.Director.EVENT_AFTER_SCENE_LAUNCH, hideLoading);
                cc.director.loadScene(sceneName, null, function () {
                    cc.loader.onProgress = null;
                    hideLoading();
                    console.log("Success to load scene: " + sceneName);
                });
            } catch (e) {
                console.error("noAdGoToScene failed:", e);
            }
        };
    </script>

    <script type="text/javascript">
        var preloader;
        var adCompleteFlag = false;

        var adEndComplete = false;

        judgeLanTitle();

        function judgeLanTitle() {

            //        console.log("window.navigator.language",window.navigator.language);

            if (window.navigator.language == "zh-CN" || window.navigator.language == "zh-cn") {
                document.title = "小游戏：合成大西瓜";
            } else if (window.navigator.language == "zh-TW") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "zh-HK") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "ko-KR") {
                document.title = "작은 놀이：큰 수박 을 합성 하 다";
            } else if (window.navigator.language == "ja-JP") {
                document.title = "ミニゲーム：合成スイカ";
            } else if (window.navigator.language == "th-TH") {
                document.title = "เกมเล็กๆ：แตงโมสังเคราะห์";
            } else {
                document.title = "Little game：Synthetic watermelon";
            }


        }

        var loadintT = document.getElementById("loadingText");
        var loadintGif = document.getElementById("loadingImg")
        setTimeout(function() {
            loadintGif.remove();
            loadintT.style.display = ""
            updateLabView(0.1);
        }, 1 * 1000)

        window.timer = null;
        window.tempSeconds = 1;
        window.loadData = {};
        loadData.completedCount = 0;
        loadData.totalCount = 0;

        onload();

        function onload() {
            var winHeight = document.documentElement.clientHeight;
            document.getElementById("canvasDiv").style.height = winHeight + "px";
        };
        window.onload = function() {
            document.getElementById("block-Box").style.display = "none";
        }

        function updateLabView(t) {
            if (timer != null) {
                clearInterval(timer);
            }
            timer = setInterval(function() {
                tempSeconds++;
                actualTotal();
                var loadintT = document.getElementById("loadingText")
                if (!loadintT) {
                    return;
                }
                loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';

                switch (tempSeconds) {
                    case 20:
                        updateLabView(0.2);
                        break;
                    case 40:
                        updateLabView(0.3);
                        break;
                    case 60:
                        updateLabView(0.4);
                        break;
                    case 96:
                        updateLabView(5);
                        break;
                    case 97:
                        updateLabView(10);
                        break;
                    case 98:
                        updateLabView(50);
                        break;
                    case 99:
                        updateLabView(100);
                        break;
                    default:
                        if (tempSeconds >= 80 && tempSeconds < 96) {
                            updateLabView(t + 0.1);
                        }
                        break;
                }
                if (tempSeconds > 100) {
                    clearInterval(timer);
                    tempSeconds = 100
                    loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';
                }
            }, t * 1000);
        }

        function actualTotal() {
            var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
            if (percent > tempSeconds && loadData.totalCount > 1) {
                tempSeconds = percent;
            }
        }


        /*setTimeout("ShowBannerAD()","2000");*/
    </script>
