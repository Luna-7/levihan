    <script type="text/javascript">
        /* 桩函数：替代已移除的 ads.js 广告逻辑。
           noAdGoToScene 负责真正启动游戏场景（原版由被 .gitignore 排除的 ads.js 实现） */
        var showMyAds = function () { console.log("showMyAds stub"); };
        var __sceneLaunched = false;
        var noAdGoToScene = function () {
            if (__sceneLaunched) return;
            __sceneLaunched = true;
            try {
                var cfg = __require("GameConfig");
                var sceneName = cfg.launchScene;
                console.log("noAdGoToScene: launching", sceneName);
                var hideLoading = function () {
                    var lt = document.getElementById("loadingText");
                    if (lt) { lt.style.display = "none"; }
                    var sp = document.getElementById("splash");
                    if (sp) { sp.style.display = "none"; }
                };
                cc.director.on(cc.Director.EVENT_AFTER_SCENE_LAUNCH, hideLoading);
                cc.director.loadScene(sceneName, null, function () {
                    cc.loader.onProgress = null;
                    hideLoading();
                    console.log("Success to load scene: " + sceneName);
                });
            } catch (e) {
                console.error("noAdGoToScene failed:", e);
            }
        };
    </script>

    <script type="text/javascript">
        var preloader;
        var adCompleteFlag = false;
        var resCompleteFlag = false;

        var adEndComplete = false;
        var resEndComplete = false;

        judgeLanTitle();

        function judgeLanTitle() {

            //        console.log("window.navigator.language",window.navigator.language);

            if (window.navigator.language == "zh-CN" || window.navigator.language == "zh-cn") {
                document.title = "小游戏：合成大西瓜";
            } else if (window.navigator.language == "zh-TW") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "zh-HK") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "ko-KR") {
                document.title = "작은 놀이：큰 수박 을 합성 하 다";
            } else if (window.navigator.language == "ja-JP") {
                document.title = "ミニゲーム：合成スイカ";
            } else if (window.navigator.language == "th-TH") {
                document.title = "เกมเล็กๆ：แตงโมสังเคราะห์";
            } else {
                document.title = "Little game：Synthetic watermelon";
            }


        }

        var loadintT = document.getElementById("loadingText");
        var loadintGif = document.getElementById("loadingImg")
        setTimeout(function() {
            loadintGif.remove();
            loadintT.style.display = ""
            updateLabView(0.1);
        }, 1 * 1000)

        window.timer = null;
        window.tempSeconds = 1;
        window.loadData = {};
        loadData.completedCount = 0;
        loadData.totalCount = 0;

        onload();

        function onload() {
            var winHeight = document.documentElement.clientHeight;
            document.getElementById("canvasDiv").style.height = winHeight + "px";
        };
        window.onload = function() {
            document.getElementById("block-Box").style.display = "none";
        }

        function updateLabView(t) {
            if (timer != null) {
                clearInterval(timer);
            }
            timer = setInterval(function() {
                tempSeconds++;
                actualTotal();
                var loadintT = document.getElementById("loadingText")
                if (!loadintT) {
                    return;
                }
                loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';

                switch (tempSeconds) {
                    case 20:
                        updateLabView(0.2);
                        break;
                    case 40:
                        updateLabView(0.3);
                        break;
                    case 60:
                        updateLabView(0.4);
                        break;
                    case 96:
                        updateLabView(5);
                        break;
                    case 97:
                        updateLabView(10);
                        break;
                    case 98:
                        updateLabView(50);
                        break;
                    case 99:
                        updateLabView(100);
                        break;
                    default:
                        if (tempSeconds >= 80 && tempSeconds < 96) {
                            updateLabView(t + 0.1);
                        }
                        break;
                }
                if (tempSeconds > 100) {
                    clearInterval(timer);
                    tempSeconds = 100
                    loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';
                }
            }, t * 1000);
        }

        function actualTotal() {
            var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
            if (percent > tempSeconds && loadData.totalCount > 1) {
                tempSeconds = percent;
            }
        }


        /*setTimeout("ShowBannerAD()","2000");*/
    </script>
